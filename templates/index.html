<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predicción de retrasos en entregas</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:20px;line-height:1.5}
.card{border:1px solid #ddd;border-radius:12px;padding:24px}
form{display:grid;gap:14px}
label{font-weight:600}
input,select,button{padding:10px;font-size:16px;width:100%;box-sizing:border-box}
button{cursor:pointer}
#resultado{margin-top:24px;padding:16px;border:1px solid #ddd;border-radius:10px}
.nota{font-size:14px;background:#f5f5f5;padding:12px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h1>Predicción de retrasos en entregas</h1>
<p class="nota">Modelo académico de referencia. Incluye <code>Days for shipping (real)</code>, por lo que esta variable representa información ex-post.</p>
<form id="formulario">
<label>Shipping Mode
<select name="shipping_mode">
<option>Standard Class</option><option>Second Class</option><option>First Class</option><option>Same Day</option>
</select></label>
<label>Días de envío programados
<input name="scheduled_days" type="number" min="0" step="0.1" value="4" required></label>
<label>Días reales de envío
<input name="real_days" type="number" min="0" step="0.1" value="5" required></label>
<label>Customer Segment
<select name="customer_segment">
<option>Consumer</option><option>Corporate</option><option>Home Office</option>
</select></label>
<label>Type
<select name="order_type">
<option>DEBIT</option><option>TRANSFER</option><option>PAYMENT</option><option>CASH</option>
</select></label>
<button id="submit" type="submit">PREDECIR</button>
</form>
<div id="resultado" aria-live="polite">Ingrese los datos y presione PREDECIR.</div>
</div>
<script>
const form = document.getElementById("formulario");
const result = document.getElementById("resultado");
form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = document.getElementById("submit");
    button.disabled = true;
    button.textContent = "PROCESANDO...";
    result.textContent = "Calculando predicción...";
    const payload = Object.fromEntries(new FormData(form).entries());
    try {
        const response = await fetch("/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "No fue posible realizar la predicción.");
        result.innerHTML =
            '<h2>' + data.result + '</h2>' +
            '<p><strong>Probabilidad:</strong> ' + (data.probability*100).toFixed(2) + '%</p>' +
            '<p><strong>Predicción:</strong> ' + data.prediction + '</p>' +
            '<p><strong>Umbral:</strong> ' + data.threshold + '</p>';
    } catch (error) {
        result.textContent = "Error: " + error.message;
    } finally {
        button.disabled = false;
        button.textContent = "PREDECIR";
    }
});
</script>
</body>
</html>
